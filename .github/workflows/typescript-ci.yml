name: TypeScript CI

on:
  push:
    branches: [trunk]
    paths:
      - "clients/typescript/**"
      - ".github/workflows/typescript-ci.yml"
  pull_request:
    branches: [trunk]
    paths:
      - "clients/typescript/**"
      - ".github/workflows/typescript-ci.yml"

concurrency:
  group: ts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
