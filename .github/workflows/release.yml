name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  # Force JS actions to Node 24 ahead of GHA's June 2026 default flip. The
  # pinned action majors below haven't published Node-24 tags yet; this env
  # var opts each one in without us tracking version bumps.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY_IMAGE: ghcr.io/alternet-dev/wss-mux

jobs:
  # ---------- Docker images (existing) ----------

  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/alternet-dev/wss-mux
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.description=WebSocket multiplexer for server-driven event fanout
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  manifest:
    name: manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$REGISTRY_IMAGE@sha256:%s " *)

  # ---------- Server binaries for GitHub Release + Homebrew ----------

  build-binaries:
    name: build-binary (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET" --bin wss-mux

      - name: Package tarball
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          STAGE="wss-mux-${REF_NAME}-${TARGET}"
          mkdir -p "dist/${STAGE}"
          cp "target/${TARGET}/release/wss-mux" "dist/${STAGE}/"
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          shasum -a 256 "dist/${STAGE}.tar.gz" | tee "dist/${STAGE}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7
          if-no-files-found: error

  # ---------- GitHub Release with binary tarballs ----------
  #
  # Body is the tag's annotation message (we write a short release-style
  # summary into every `git tag -a`); pre-1.0 RC/beta tags (any tag
  # containing `-`) are marked prerelease. Idempotent: re-running after
  # a partial release uploads any missing binaries to the existing
  # release entry rather than failing.

  github-release:
    name: github-release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/binaries
          pattern: binary-*
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            echo "release $REF_NAME already exists; uploading binaries (--clobber)"
            gh release upload "$REF_NAME" \
              /tmp/binaries/*.tar.gz /tmp/binaries/*.sha256 \
              --clobber
            exit 0
          fi
          flags=()
          [[ "$REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$REF_NAME" \
            --title "$REF_NAME" \
            --notes-from-tag \
            --verify-tag \
            "${flags[@]}" \
            /tmp/binaries/*.tar.gz \
            /tmp/binaries/*.sha256

  # ---------- npm publish for @alternet/wss-mux-client ----------

  npm-publish:
    name: npm-publish
    runs-on: ubuntu-latest
    # OIDC for npm Trusted Publishing — the runner mints a short-lived
    # token that npm exchanges for publish capability via the trusted
    # publisher configured on the @alternet/wss-mux-client package.
    # No static NPM_TOKEN involved.
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # npm Trusted Publishing (token-free PUT via OIDC) was added in
      # npm 11.5.1. setup-node ships whatever npm bundles with the picked
      # Node version, which can be older than 11.5 even on Node 22/24.
      # Pin npm explicitly to guarantee Trusted Publishing support; log
      # versions so failures are diagnosable.
      - name: Pin npm to 11.5+
        run: |
          set -euo pipefail
          npm install -g 'npm@>=11.5.1'
          node --version
          npm --version

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Publish to npm (with provenance via OIDC)
        # --provenance attaches a signed attestation linking this version
        # to the workflow run that produced it. Required by Trusted
        # Publishing; visible as a "Provenance" badge on npmjs.com.
        run: npm publish --provenance --access public

  # ---------- Homebrew tap formula update ----------

  homebrew-tap:
    name: homebrew-tap
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - name: Mint tap-write token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: alternet-dev
          repositories: homebrew-tap

      - name: Resolve App bot user id
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "user-id=${user_id}" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: alternet-dev/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap

      - name: Render formula
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash source/scripts/release/render-homebrew-formula.sh \
            "$REF_NAME" \
            "$REPO" \
            > tap/Formula/wss-mux.rb

      - name: Commit + push to tap
        working-directory: tap
        env:
          REF_NAME: ${{ github.ref_name }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.bot.outputs.user-id }}
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add Formula/wss-mux.rb
          if git diff --cached --quiet; then
            echo "no formula change"
            exit 0
          fi
          git commit -m "wss-mux $REF_NAME"
          git push
