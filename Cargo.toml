[package]
name = "wss-mux"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "WebSocket multiplexer for server-driven event fanout"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alternet-dev/wss-mux"
readme = "README.md"
keywords = ["websocket", "multiplexer", "pubsub", "fanout", "realtime"]
categories = ["network-programming", "web-programming::websocket"]

[lib]
name = "wss_mux"
path = "src/lib.rs"

[[bin]]
name = "wss-mux"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
jsonwebtoken = { version = "9", default-features = false }
dashmap = "5"
prometheus-client = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
assert_matches = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.21"
