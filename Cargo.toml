[package]
name = "wss-mux"
version = "0.5.1"
edition = "2021"
rust-version = "1.75"
description = "WebSocket multiplexer for server-driven event fanout"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alternet-dev/wss-mux"
readme = "README.md"
keywords = ["websocket", "multiplexer", "pubsub", "fanout", "realtime"]
categories = ["network-programming", "web-programming::websocket"]
# Both binaries are declared explicitly below; disable bin
# auto-discovery so `src/bin/loadgen/main.rs` is not also picked up as a
# bare `loadgen` target alongside the explicit `wss-mux-loadgen`.
autobins = false

[lib]
name = "wss_mux"
path = "src/lib.rs"
# Only the `[[bench]]` targets carry benchmarks; keep `cargo bench`
# from also running the lib/bin/test under the libtest harness (it
# rejects criterion's CLI flags).
bench = false

[[bin]]
name = "wss-mux"
path = "src/main.rs"
bench = false

[[bin]]
name = "wss-mux-loadgen"
path = "src/bin/loadgen/main.rs"
# Load/stress harness. `bench = false` keeps `cargo bench` from also
# running it under the libtest harness (only the criterion benches run).
bench = false

[[test]]
name = "integration"
path = "tests/integration/main.rs"
bench = false

[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "registry"
harness = false

[[bench]]
name = "envelope"
harness = false

[[bench]]
name = "cbor"
harness = false

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
axum = { version = "0.7", features = ["ws", "macros"] }
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ciborium = "0.2"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
dashmap = "5"
prometheus-client = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tokio-test = "0.4"
assert_matches = "1"
# In-test OIDC IdP (JWKS + discovery) for the auth_oidc suite; same
# axum as the normal dep, features unified — no production impact.
axum = "0.7"
# Adds the `json` feature on top of the normal-dependency `rustls-tls`
# for the HTTP integration suite; Cargo unifies features so the
# production build keeps the minimal `rustls-tls`-only surface.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.21"
ciborium = "0.2"
criterion = "0.5"

[profile.bench]
# Bench against an optimized, low-variance build so microbench numbers
# reflect release behavior.
lto = "thin"
codegen-units = 1
